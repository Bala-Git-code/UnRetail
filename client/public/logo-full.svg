<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%" fill="none">
  <defs>
    <!-- Metallic Silver Gradient -->
    <linearGradient id="silverBaseFull" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E5E7EB" />
      <stop offset="50%" stop-color="#9CA3AF" />
      <stop offset="75%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>

    <linearGradient id="silverGlossFull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#D1D5DB" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4B5563" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Lime Gradient -->
    <linearGradient id="neonLimeFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="35%" stop-color="#D9F99D" />
      <stop offset="65%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#65A30D" />
    </linearGradient>

    <filter id="limeGlowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow3dFull" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Dark Brand Canvas Background -->
  <rect width="100%" height="100%" fill="#09090b" rx="20" />

  <g filter="url(#shadow3dFull)">
    <!-- Symbol Emblem Group -->
    <g transform="translate(10, 0)">
      <!-- Silver Teardrop Ring -->
      <path d="M 62,25 
               C 98,25 125,50 125,86 
               C 125,122 98,147 62,147 
               C 32,147 25,125 25,86 
               C 25,47 32,25 62,25 Z
               M 62,50
               C 45,50 43,65 43,86
               C 43,107 45,122 62,122
               C 83,122 100,105 100,86
               C 100,67 83,50 62,50 Z" 
            fill="url(#silverBaseFull)" fill-rule="evenodd" />

      <path d="M 62,25 C 98,25 125,50 125,86 C 125,122 98,147 62,147 C 32,147 25,125 25,86 C 25,47 32,25 62,25 Z M 62,50 C 45,50 43,65 43,86 C 43,107 45,122 62,122 C 83,122 100,105 100,86 C 100,67 83,50 62,50 Z"
            fill="url(#silverGlossFull)" fill-rule="evenodd" opacity="0.5" />

      <!-- Neon Lime Ring -->
      <path d="M 145,25 
               C 181,25 210,54 210,90 
               C 210,126 181,155 145,155 
               C 109,155 80,126 80,90 
               C 80,54 109,25 145,25 Z
               M 145,50
               C 123,50 105,68 105,90
               C 105,112 123,130 145,130
               C 167,130 185,112 185,90
               C 185,68 167,50 145,50 Z" 
            fill="url(#neonLimeFull)" fill-rule="evenodd" filter="url(#limeGlowFull)" />
    </g>

    <!-- Wordmark "UNRETAIL" -->
    <text x="245" y="102" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="78" 
          letter-spacing="2" 
          fill="url(#silverBaseFull)">UNRETAIL</text>

    <!-- Specular Highlight for Text -->
    <text x="245" y="102" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="78" 
          letter-spacing="2" 
          fill="url(#silverGlossFull)" opacity="0.4">UNRETAIL</text>

    <!-- Subtitle Text -->
    <text x="247" y="132" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="700" 
          font-size="14" 
          letter-spacing="1.5" 
          fill="#A3E635" 
          filter="url(#limeGlowFull)">CONNECTING INDEPENDENT THRIFT STORES WITH CUSTOMERS</text>
  </g>
</svg>
